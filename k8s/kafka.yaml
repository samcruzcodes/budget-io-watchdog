# One Kafka broker (KRaft: broker and controller in one process), like docker-compose.yml.
#
# The networking trap: a client only uses the "kafka:9092" Service for its first connection. The broker then answers
# with its advertised address, and every later connection goes there. So the broker advertises its own stable DNS name
# from the headless Service (kafka-0.kafka-headless...), which every pod can resolve and which survives restarts.
# A pod IP changes on every restart, and "localhost" would point each client at itself.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: watchdog
spec:
  clusterIP: None # headless: DNS names for each pod instead of one load-balanced IP
  # Kafka has to resolve its own name while it's starting, before it's Ready.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
    - name: controller
      port: 9093
---
# What clients bootstrap from: kafka:9092.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: watchdog
spec:
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: watchdog
spec:
  serviceName: kafka-headless # gives the pod the DNS name kafka-0.kafka-headless.watchdog.svc.cluster.local
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Kubernetes would otherwise add variables like KAFKA_PORT for the "kafka" Service, and this image turns every
      # KAFKA_* variable into a broker setting.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's own user (appuser)
        fsGroup: 1000   # makes the data volume writable by that user, like Compose's tmpfs mode=1777
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: CLUSTER_ID
              value: hB_O_huMRcG2piITu59VjA
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka-headless.watchdog.svc.cluster.local:9093
            - name: KAFKA_LISTENERS
              value: INTERNAL://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka-0.kafka-headless.watchdog.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # Topics are created explicitly by the kafka-topics Job.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # A single broker can only keep one copy of Kafka's internal topics.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # A fixed heap, well inside the memory limit, so the page cache and the JVM's other memory fit too.
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
          readinessProbe:
            # A plain TCP check: cheaper than running a Kafka tool, which starts a JVM every time.
            tcpSocket:
              port: 9092
            periodSeconds: 5
          resources:
            requests:
              memory: 768Mi
              cpu: 250m
            limits:
              memory: 1280Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        # Thrown away with the pod, like the Compose demo's tmpfs. A real cluster would use a PersistentVolumeClaim.
        - name: data
          emptyDir: {}
