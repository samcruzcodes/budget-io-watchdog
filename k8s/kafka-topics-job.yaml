# Creates the topics once, like kafka-init in docker-compose.yml: 3 partitions each, one copy (one broker).
# Each dead-letter topic has as many partitions as its topic, because a failed message keeps its partition number.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: watchdog
spec:
  backoffLimit: 6 # retried if Kafka isn't up yet
  template:
    metadata:
      labels:
        app: kafka-topics
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topics
          image: apache/kafka:4.2.2
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xmx128m
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
                echo "waiting for Kafka"; sleep 2
              done
              for topic in transactions transaction-labels transactions.DLT transaction-labels.DLT alerts; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "$topic" --partitions 3 --replication-factor 1
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
          resources:
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
