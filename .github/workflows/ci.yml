# Runs on every push and pull request: the backend build with its unit and integration tests, the dashboard's tests
# and build, and the browser tests against the whole stack in Docker Compose.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit and integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # *Test classes need nothing; *IT classes start real Kafka and Postgres with Testcontainers, which uses the
      # Docker that GitHub's Linux runners already have.
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  dashboard:
    name: Dashboard (unit tests and build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # type check, then the production build

  e2e:
    name: Browser tests (whole stack)
    needs: [backend, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait until the watchdog is ready and the rules have raised an alert
        run: |
          for attempt in $(seq 1 60); do
            alerts=$(curl -sf localhost:8082/api/stats | python3 -c "import sys, json; print(json.load(sys.stdin)['totals']['alerts'])" || echo 0)
            if [ "$alerts" -ge 1 ]; then
              echo "ready: $alerts alerts"
              exit 0
            fi
            sleep 5
          done
          echo "the stack never produced an alert"
          exit 1
      # GitHub's Linux runners come with Chrome; Selenium downloads the matching driver.
      - run: ./mvnw --batch-mode --no-transfer-progress -Pe2e -pl e2e-tests verify
      - name: Show the logs if anything failed
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down
