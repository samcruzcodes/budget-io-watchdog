# Serves the dashboard and passes /api through to the watchdog, so the browser talks to one origin (no CORS needed).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Look the watchdog up again every few seconds instead of once at startup, so nginx keeps working when the
    # watchdog is restarted (the dashboard shows "Disconnected" meanwhile) and can start before it's up.
    resolver 127.0.0.11 valid=5s;
    set $watchdog http://watchdog:8082;
    set $simulator http://simulator:8090;

    # The live stream: pass events through as they come instead of buffering them, and keep the connection open.
    location = /api/stream {
        proxy_pass $watchdog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The simulator's control API (pause, resume, speed). Its port isn't published; this is the only way in.
    location /api/simulator/ {
        proxy_pass $simulator;
    }

    location /api/ {
        proxy_pass $watchdog;
    }

    # One page app: every other path gets index.html.
    location / {
        try_files $uri /index.html;
    }
}
