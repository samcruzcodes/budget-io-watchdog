# Defaults for running the service on your machine against `docker compose up` (Kafka on localhost:9094, Postgres on
# localhost:5432). In Compose, environment variables override them: SPRING_KAFKA_BOOTSTRAP_SERVERS maps onto
# spring.kafka.bootstrap-servers, SPRING_DATASOURCE_URL onto spring.datasource.url, and so on.
spring:
  application:
    name: watchdog
  datasource:
    url: jdbc:postgresql://localhost:5432/watchdog
    username: watchdog
    password: watchdog
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      # A brand-new consumer group starts from the oldest message instead of only new ones.
      auto-offset-reset: earliest
      # Messages are JSON strings; MessageJson turns them into records (see TransactionParser).
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Publishes alerts, and failed messages to the dead-letter topic. A send only succeeds once Kafka has stored it.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

watchdog:
  # Detection rule thresholds: starting values, explained in docs/DESIGN.md. Each rule's Settings record rejects bad
  # values at startup. Environment variables override them too, e.g. WATCHDOG_RULES_DUPLICATECHARGE_WINDOW=5m.
  rules:
    duplicate-charge:
      window: 10m
    trial-conversion:
      max-trial-cents: 100
      min-multiple: 5
      min-delay: 5d
      max-delay: 45d
    price-hike:
      min-gap: 26d
      max-gap: 35d
      tolerance-percent: 1
    spending-spike:
      categories: [DINING, SHOPPING]
      min-std-devs: 3
      min-history-days: 14
      min-day-total-cents: 5000
    card-testing:
      window: 60m
      max-probe-cents: 200
      min-probes: 3
      min-charge-cents: 10000
    new-country:
      min-prior-transactions: 20
      travel-lookback: 30d

logging:
  level:
    org.apache.kafka: warn
